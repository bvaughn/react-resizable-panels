name: "Prettier"
on:
  pull_request:
  push:
    branches: [main]
jobs:
  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --recursive
      - name: Run Prettier
        run: pnpm run prettier:ci
