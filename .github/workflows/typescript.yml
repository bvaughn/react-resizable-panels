name: "TypeScript"
on:
  pull_request:
  push:
    branches: [main]
jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --recursive
      - name: Build NPM package
        run: pnpm build
      - name: Run TypeScript
        run: pnpm tsc
